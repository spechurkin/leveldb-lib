[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "multileveldb"
version = "1.0.0"
description = "Binary-safe Google LevelDB access through the MultiLevelDB C ABI"
readme = "README.md"
requires-python = ">=3.10"
license = "0BSD"
license-files = ["LICENSE"]

[project.urls]
Repository = "https://github.com/spechurkin/leveldb-lib"
Issues = "https://github.com/spechurkin/leveldb-lib/issues"

[tool.setuptools.packages.find]
include = ["multileveldb*"]
